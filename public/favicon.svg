  <!-- Background subtle badge -->
  <rect x="2" y="2" width="44" height="44" rx="14" fill="#0c1024" stroke="url(#mc-grad)" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Intelligent conversational orbit -->
  <path d="M12 22C12 15.3726 17.3726 10 24 10C30.6274 10 36 15.3726 36 22C36 28.6274 30.6274 34 24 34C21.6 34 19.35 33.3 17.5 32.1L12 34L13.8 28.7C12.7 26.7 12 24.4 12 22Z" 

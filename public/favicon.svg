  <!-- Neural Synapse Nodes -->
  <circle cx="19" cy="18" r="2.2" fill="#818cf8" filter="url(#glow)" />
  <circle cx="29" cy="18" r="2.2" fill="#06b6d4" filter="url(#glow)" />
  <circle cx="24" cy="26" r="2.2" fill="#38bdf8" filter="url(#glow)" />
  

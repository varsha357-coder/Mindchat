  <line x1="29" y1="18" x2="24" y2="26" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="1 1" />
  <line x1="19" y1="18" x2="29" y2="18" stroke="#a5b4fc" stroke-width="1.2" stroke-opacity="0.4" />

